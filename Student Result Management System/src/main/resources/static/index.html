<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
    <h1>Student Result Management System</h1>
    <p>Java + Spring Boot + MySQL</p>
</header>

<main>
    <section class="card">
        <h2>Students</h2>
        <button onclick="loadStudents()">Refresh</button>
        <table>
            <thead><tr><th>ID</th><th>Roll No.</th><th>Name</th><th>Email</th><th>Semester</th><th>Department</th></tr></thead>
            <tbody id="students"></tbody>
        </table>
    </section>

    <section class="card">
        <h2>Add Student</h2>
        <form id="studentForm">
            <input name="firstName" placeholder="First name" required>
            <input name="lastName" placeholder="Last name" required>
            <input name="email" type="email" placeholder="Email" required>
            <input name="rollNumber" placeholder="Roll number" required>
            <input name="semester" type="number" min="1" max="8" placeholder="Semester" required>
            <input name="department" placeholder="Department">
            <button type="submit">Save Student</button>
        </form>
    </section>
</main>

<script src="/js/app.js"></script>
</body>
</html>
